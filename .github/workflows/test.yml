name: Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci
      - run: npm test
        if: runner.os != 'Windows'
      # Avoid cold PowerShell startup competing with package installation IO.
      - run: npm run build && node --test --test-concurrency=1 "tests/**/*.test.mjs"
        if: runner.os == 'Windows'
